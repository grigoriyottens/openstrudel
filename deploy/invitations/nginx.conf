# Public handoff for Camera, Telegram and browsers. The invitation stays in the
# fragment, outside HTTP requests. Keep the association's other apps intact.
location = /openstrudel/connect.html {
    alias /var/www/waiuni/apps/web/public/openstrudel/connect.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /.well-known/apple-app-site-association {
    alias /var/www/waiuni/apps/web/public/.well-known/apple-app-site-association;
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
}
